name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      split_apks:
        description: 'Build per-ABI APKs (smaller, recommended)'
        type: boolean
        default: true
      branch:
        description: 'Branch to build from'
        type: string
        default: 'beta'

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get application version name
        run: echo "VERSION_NAME=$(${GITHUB_WORKSPACE}/gradlew -q printVersionName)" >> $GITHUB_ENV

      - name: Write keystore
        if: ${{ secrets.KEYSTORE != '' }}
        run: |
          echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> keystore.properties
          echo keyAlias='${{ secrets.KEY_ALIAS }}'             >> keystore.properties
          echo keyPassword='${{ secrets.KEY_PASSWORD }}'       >> keystore.properties
          echo storeFile='${{ github.workspace }}/key.jks'     >> keystore.properties
          echo ${{ secrets.KEYSTORE }} | base64 --decode > ${{ github.workspace }}/key.jks

      - name: Build Release APK (per-ABI split — smaller size)
        if: ${{ github.event.inputs.split_apks == 'true' }}
        run: ./gradlew assembleRelease -PsplitApks

      - name: Build Release APK (universal)
        if: ${{ github.event.inputs.split_apks != 'true' }}
        run: ./gradlew assembleRelease

      - name: Upload raw APKs
        uses: actions/upload-artifact@v4
        with:
          name: "Iconify Release v${{ env.VERSION_NAME }} (APKs)"
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Package ZIP (arm64 APK + ModuleBase)
        run: |
          set -e

          ZIP_NAME="Iconify v${{ env.VERSION_NAME }}.zip"
          RELEASE_DIR="releases"
          APK_DIR="app/build/outputs/apk/release"

          mkdir -p "$RELEASE_DIR/temp"

          # Prefer arm64-v8a for the Magisk module (smallest + most common ABI)
          if ls "$APK_DIR"/*arm64-v8a*.apk 2>/dev/null | grep -q .; then
            cp "$APK_DIR"/*arm64-v8a*.apk "$RELEASE_DIR/temp/Iconify.apk"
          else
            cp "$APK_DIR"/*.apk "$RELEASE_DIR/temp/Iconify.apk"
          fi

          # Copy ModuleBase and fix package name to release ID (no .debug suffix)
          cp -r ModuleBase/* "$RELEASE_DIR/temp/"
          sed -i 's/PKGNAME="\$BASEPKGNAME\.debug"/PKGNAME="\$BASEPKGNAME"/' "$RELEASE_DIR/temp/customize.sh" || true

          cd "$RELEASE_DIR/temp"
          zip -r "../$ZIP_NAME" .
          cd ../..
          rm -rf "$RELEASE_DIR/temp"

      - name: Upload Release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: "Iconify Release v${{ env.VERSION_NAME }} (ZIP)"
          path: releases/*.zip
          if-no-files-found: error
